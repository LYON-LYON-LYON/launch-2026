name: sync-data

# 数据自动同步流水线（B1 · 自动上线版）
# 定时：每日 UTC 02:23 / 14:23（北京时间 10:23 / 22:23），避开整点拥堵
# 手动：workflow_dispatch 支持应急重跑与"首次 llId 回填"（backfill=true）
# 变更经 validate-data.js 硬门禁后直接提交到 master。
# 注意：GITHUB_TOKEN 推送的提交不会触发 legacy Pages 构建（GitHub 官方限制），
#       因此推送成功后显式调用 POST /pages/builds 请求一次构建，完成"同步即上线"。
# 中国事件永不自动入库，只追加到 docs/pending-china.md 并在运行摘要中提醒。
on:
  schedule:
    - cron: '23 2,14 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '宽窗口抓取（首次为存量国际事件回填 llId 时使用）'
        type: boolean
        required: false
        default: false
      force_update:
        description: '首次运行也允许更新事实字段（默认只回填 llId）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write    # 允许显式请求 Pages 构建（GITHUB_TOKEN 推送本身不会触发）

# 同一时间只允许一个同步任务在跑，新触发的取消旧的（防 cron 与手动触发撞车）
concurrency:
  group: sync-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取 Launch Library 数据
        run: node scripts/fetch-launches.js ${{ github.event.inputs.backfill == 'true' && '--backfill' || '' }}
        env:
          LL_API_KEY: ${{ secrets.LL_API_KEY }}   # 可选；缺省匿名调用，额度降低但可跑

      - name: 字段映射与合并
        run: node scripts/merge-data.js ${{ github.event.inputs.force_update == 'true' && '--force-update' || '' }}

      # 硬门禁前置：任一校验项 FAIL → validate 退出码 1 → 本 job 终止 → 绝不会走到提交/推送。
      # 注意此时 data.js 已被 merge-data.js 改写，但那只是 runner 上的临时工作区。
      - name: 数据校验（硬门禁）
        run: node scripts/validate-data.js

      # 运行摘要落到 Actions 页面（.sync/ 已 gitignore，不入库），包含逐字段 diff 与中国待审清单
      - name: 运行摘要（含中国待审提醒）
        if: always()
        run: |
          if [ -f .sync/summary.md ]; then
            cat .sync/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "中国事件永不自动入库：本次新增待审条目见 docs/pending-china.md，需人工核实后写入 EVENTS。" >> "$GITHUB_STEP_SUMMARY"

      # 只有 data.js / docs/pending-china.md 有 diff 才提交；无变更则 master 保持不动。
      # 与人工推送撞车时 rebase 重试，冲突则安全放弃（绝不 force push），下次定时重跑。
      - name: 提交并自动上线（master）
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.js docs/pending-china.md
          if git diff --cached --quiet; then
            echo "本次无数据变更，master 保持不动"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): Launch Library 自动同步 · run #${{ github.run_number }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "已推送 master"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "推送失败（可能与人工推送撞车），第 $attempt 次 rebase 重试"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::warning::与人工提交冲突，本次自动同步安全放弃，下次定时运行将重试"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::推送重试 3 次仍失败"
          exit 1

      # 关键补丁：GITHUB_TOKEN 推送的提交不会触发 legacy Pages 构建（GitHub 官方限制）。
      # 显式请求一次构建，效果等同于往默认分支推一次提交，但不需要额外 commit。
      - name: 触发 Pages 重新发布
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS --max-time 30 -o /tmp/pages-build.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds") || code="000"
          if [ "$code" = "201" ] || [ "$code" = "202" ]; then
            echo "Pages 构建已排队（HTTP $code）：$(cat /tmp/pages-build.json)"
          else
            echo "::warning::Pages 构建请求返回 HTTP $code：$(cat /tmp/pages-build.json)"
            echo "数据已进 master，可稍后在 Actions → pages-build-deployment 手动重跑。"
          fi
